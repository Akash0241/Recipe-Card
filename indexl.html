<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="rule">
      <p class="label">HOMEMADE WITH LOVE</p>

      <h1 id="head">The Recipe Book</h1>

      <p>Simple, delicious receipes for every occasion and mood</p>

      <div class="pat">
        <span></span>
        ✦
        <span></span>
      </div>
    </header>

    <!-- FILTER BAR -->

    <nav class="filter">
      <button class="filterbtn">All recipes</button>
      <button class="filterbtn">Breakfast</button>
      <button class="filterbtn">Lunch</button>
      <button class="filterbtn">Dinner</button>
      <button class="filterbtn">Deserts</button>
    </nav>
    <!-- MAIN -->
    <main class="main">
      <h2 class="section-heading">
        Featured recipes

        <span>6 dishes</span>
      </h2>

      <div class="food-cards">
                                 <!-- CARD 1 -->
        <div class="card">
          <div class="card-img">
            <img
              src="https://images.unsplash.com/photo-1603046891726-36bfd957e0bf?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt="avacado toast"
              
            />
            <span div class="card-badge">Breakfast</span>
            <button><div class="card-save"></div></button>
          </div>
          <div class="card-category">Breakfast ✦ vegetarian</div>
        </div>
                                  <!-- CARD 2  -->
        <div class="card">
          <div class="card-img">
            <img
              src=https://plus.unsplash.com/premium_photo-1678897742200-85f052d33a71?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Q2xhc3NpYyUyMFNwYWdoZXR0aSUyMENhcmJvbmFyYXxlbnwwfHwwfHx8MA%3D%3D
              alt="classic sphageti"
            />
          </div>
        </div>
                                   <!-- CARD 3 -->
        <div class="card">
          <div class="card-img">
            <img
              src=https://media.istockphoto.com/id/2030549106/photo/chocolate-lava-cake.webp?a=1&b=1&s=612x612&w=0&k=20&c=a7-l76jr9qzEkn635Ka2BUtlPiV90VRvTI_BqGVIqHo=
            />
          </div>
        </div>
                                    <!-- CARD 4 -->
        <div class="card">
          <div class="card-img">
            <img
              src="https://images.unsplash.com/photo-1719677775416-1dd6a93f1a73?q=80&w=408&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt="rainbow grain bowl"
            />
          </div>
        </div>
                                    <!-- CARD 5 -->
        <div class="card">
          <div class="card-img">
            <img
              src="https://media.istockphoto.com/id/1286704566/photo/image-of-turquoise-blue-cooking-pan-filled-with-butter-chicken-tikka-curry-large-chunks-of.jpg?s=612x612&w=0&k=20&c=OLP7dEK6tyVtaUZAGC9SYftn9JOanU7IibSRs_F37DA="
              alt="butter chicken masala"
            />
          </div>
        </div>
                                    <!-- CARD 6 -->
        <div class="card">
          <div class="card-img"><img src="https://plus.unsplash.com/premium_photo-1692193554212-6a27903ab9c4?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Rmx1ZmZ5JTIwQmx1ZWJlcnJ5JTIwUGFuY2FrZXN8ZW58MHx8MHx8fDA%3D" alt="blueberry pancakes" /></div>
        </div>
      </div>
    </main>
  </body>
</html>
